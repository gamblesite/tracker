<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split-Screen Bet Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: fixed;
        }

        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
        }

        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px 16px;
            text-align: center;
            position: relative;
            touch-action: manipulation;
        }

        /* Red Side (Top - Flipped 180 degrees) */
        .player-red {
            background: linear-gradient(135deg, #2b0c0c 0%, #150303 100%);
            border-bottom: 2px solid #451515;
            transform: rotate(180deg);
        }

        /* Blue Side (Bottom - Upright) */
        .player-blue {
            background: linear-gradient(135deg, #0c1c2b 0%, #030810 100%);
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .player-name {
            font-size: 14px;
            font-weight: 600;
            background: none;
            border: none;
            color: #fff;
            text-align: center;
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            padding: 2px 6px;
            width: 130px;
        }

        .player-name:focus {
            border-bottom: 1px dashed #38bdf8;
            outline: none;
        }

        .balance {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .controls-wrapper {
            width: 100%;
            max-width: 280px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .button-row {
            display: flex;
            gap: 4px;
            width: 100%;
        }

        .btn-action {
            flex: 1;
            padding: 6px 2px;
            border-radius: 6px;
            border: none;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
            transition: opacity 0.1s;
        }

        .btn-action:active { opacity: 0.7; }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

        .btn-red { background: #ef4444; }
        .btn-red-take { background: #7f1d1d; font-size: 10px; }
        
        .btn-blue { background: #3b82f6; }
        .btn-blue-take { background: #1e3a8a; font-size: 10px; }

        .btn-ready {
            background: #3f3f46;
            color: #fff;
            font-size: 11px;
            padding: 5px;
            border-radius: 6px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-top: 2px;
        }

        .btn-ready.ready {
            background: #22c55e;
            color: #000;
        }

        .central-hud {
            position: absolute;
            top: 60%;
            left: 100px;
            transform: translateY(-50%) rotate(-90deg);
            transform-origin: left center;
            background: #18181b;
            border: 2px solid #3f3f46;
            border-radius: 14px;
            padding: 10px 14px;
            text-align: center;
            z-index: 30;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            width: 160px;
        }

        .pot-title {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #a1a1aa;
            margin-bottom: 1px;
        }

        .pot-amount {
            font-size: 22px;
            font-weight: 800;
            color: #facc15;
            margin-bottom: 6px;
        }

        .pot-buttons {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 4px;
        }

        .pot-buttons button {
            padding: 5px 4px;
            border-radius: 6px;
            border: none;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            color: #fff;
        }

        .btn-award-red { background: #ef4444; }
        .btn-award-blue { background: #3b82f6; }
        
        .btn-tie {
            width: 100%;
            background: #52525b;
            color: #fff;
            padding: 5px 4px;
            border-radius: 6px;
            border: none;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .timer-banner {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 9px;
            color: #a1a1aa;
            background: rgba(255,255,255,0.06);
            padding: 2px 8px;
            border-radius: 20px;
            z-index: 10;
        }

        .lock-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
            pointer-events: none;
        }

        .lock-overlay.active {
            display: flex;
        }

        .lock-badge {
            background: #eab308;
            color: #000;
            font-size: 10px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="timer-banner" id="timerBanner">Next $1k Refill: --:--:--</div>

    <!-- Rotated Left-Center Pot HUD -->
    <div class="central-hud">
        <div class="pot-title">The Pot</div>
        <div class="pot-amount" id="potAmount">$0</div>
        <div class="pot-buttons">
            <button class="btn-award-red" onclick="awardPot('red')">Red Wins</button>
            <button class="btn-award-blue" onclick="awardPot('blue')">Blue Wins</button>
        </div>
        <button class="btn-tie" onclick="tiePot()">Tie / Push</button>
    </div>

    <div class="game-container">
        <!-- Red Player Side (Top - Flipped 180 Degrees) -->
        <div class="player-section player-red" id="sideRed">
            <div class="lock-overlay" id="lockRed"><div class="lock-badge">Locked In</div></div>
            <div class="player-header">
                <input type="text" id="nameRed" class="player-name" value="Red Player" autocomplete="off">
            </div>
            <div class="balance" id="balanceRed">$1000</div>
            <div class="controls-wrapper">
                <div class="button-row">
                    <button class="btn-action btn-red" onclick="bet('red', 10)">+$10</button>
                    <button class="btn-action btn-red" onclick="bet('red', 50)">+$50</button>
                    <button class="btn-action btn-red" onclick="bet('red', 100)">+$100</button>
                </div>
                <div class="button-row">
                    <button class="btn-action btn-red-take" onclick="takeBack('red', 10)">-$10</button>
                    <button class="btn-action btn-red-take" onclick="takeBack('red', 50)">-$50</button>
                    <button class="btn-action btn-red-take" onclick="takeBack('red', 100)">-$100</button>
                </div>
                <button class="btn-ready" id="readyBtnRed" onclick="toggleReady('red')">Ready Up</button>
            </div>
        </div>

        <!-- Blue Player Side (Bottom - Upright) -->
        <div class="player-section player-blue" id="sideBlue">
            <div class="lock-overlay" id="lockBlue"><div class="lock-badge">Locked In</div></div>
            <div class="player-header">
                <input type="text" id="nameBlue" class="player-name" value="Blue Player" autocomplete="off">
            </div>
            <div class="balance" id="balanceBlue">$1000</div>
            <div class="controls-wrapper">
                <div class="button-row">
                    <button class="btn-action btn-blue" onclick="bet('blue', 10)">+$10</button>
                    <button class="btn-action btn-blue" onclick="bet('blue', 50)">+$50</button>
                    <button class="btn-action btn-blue" onclick="bet('blue', 100)">+$100</button>
                </div>
                <div class="button-row">
                    <button class="btn-action btn-blue-take" onclick="takeBack('blue', 10)">-$10</button>
                    <button class="btn-action btn-blue-take" onclick="takeBack('blue', 50)">-$50</button>
                    <button class="btn-action btn-blue-take" onclick="takeBack('blue', 100)">-$100</button>
                </div>
                <button class="btn-ready" id="readyBtnBlue" onclick="toggleReady('blue')">Ready Up</button>
            </div>
        </div>
    </div>

    <script>
        let state = {
            nameRed: "Red Player",
            nameBlue: "Blue Player",
            balanceRed: 1000,
            balanceBlue: 1000,
            contributedRed: 0,
            contributedBlue: 0,
            pot: 0,
            readyRed: false,
            readyBlue: false,
            lastRefillTime: Date.now()
        };

        const REFILL_INTERVAL = 24 * 60 * 60 * 1000;

        window.onload = function() {
            loadState();
            checkDailyRefill();
            updateUI();
            setInterval(updateTimerDisplay, 1000);

            document.getElementById('nameRed').addEventListener('input', (e) => {
                state.nameRed = e.target.value;
                saveState();
            });
            document.getElementById('nameBlue').addEventListener('input', (e) => {
                state.nameBlue = e.target.value;
                saveState();
            });
        };

        function saveState() {
            localStorage.setItem('split_bet_hub_rotpot_v1', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('split_bet_hub_rotpot_v1');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) { console.error(e); }
            }
        }

        function checkDailyRefill() {
            const now = Date.now();
            const elapsed = now - state.lastRefillTime;
            if (elapsed >= REFILL_INTERVAL || isNaN(elapsed)) {
                const cycles = Math.max(1, Math.floor(elapsed / REFILL_INTERVAL));
                state.balanceRed += (1000 * cycles);
                state.balanceBlue += (1000 * cycles);
                state.lastRefillTime = now;
                saveState();
            }
        }

        function updateTimerDisplay() {
            const now = Date.now();
            const nextTime = state.lastRefillTime + REFILL_INTERVAL;
            let timeLeft = nextTime - now;
            if (timeLeft <= 0) {
                checkDailyRefill();
                timeLeft = REFILL_INTERVAL;
            }
            const hours = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((timeLeft / 1000 / 60) % 60);
            const seconds = Math.floor((timeLeft / 1000) % 60);

            document.getElementById('timerBanner').innerText = 
                `Next $1k Refill: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateUI() {
            if (document.activeElement !== document.getElementById('nameRed')) {
                document.getElementById('nameRed').value = state.nameRed;
            }
            if (document.activeElement !== document.getElementById('nameBlue')) {
                document.getElementById('nameBlue').value = state.nameBlue;
            }

            document.getElementById('balanceRed').innerText = '$' + state.balanceRed;
            document.getElementById('balanceBlue').innerText = '$' + state.balanceBlue;
            document.getElementById('potAmount').innerText = '$' + state.pot;

            const btnRed = document.getElementById('readyBtnRed');
            const btnBlue = document.getElementById('readyBtnBlue');
            const lockRed = document.getElementById('lockRed');
            const lockBlue = document.getElementById('lockBlue');

            if (state.readyRed) {
                btnRed.innerText = "Ready!";
                btnRed.classList.add('ready');
                lockRed.classList.add('active');
            } else {
                btnRed.innerText = "Ready Up";
                btnRed.classList.remove('ready');
                lockRed.classList.remove('active');
            }

            if (state.readyBlue) {
                btnBlue.innerText = "Ready!";
                btnBlue.classList.add('ready');
                lockBlue.classList.add('active');
            } else {
                btnBlue.innerText = "Ready Up";
                btnBlue.classList.remove('ready');
                lockBlue.classList.remove('active');
            }
        }

        function toggleReady(player) {
            if (player === 'red') {
                state.readyRed = !state.readyRed;
            } else {
                state.readyBlue = !state.readyBlue;
            }
            saveState();
            updateUI();
        }

        function bet(player, amount) {
            if (state.readyRed && state.readyBlue) return;

            if (player === 'red') {
                if (state.balanceRed >= amount) {
                    state.balanceRed -= amount;
                    state.contributedRed += amount;
                    state.pot += amount;
                }
            } else {
                if (state.balanceBlue >= amount) {
                    state.balanceBlue -= amount;
                    state.contributedBlue += amount;
                    state.pot += amount;
                }
            }
            saveState();
            updateUI();
        }

        function takeBack(player, amount) {
            if (state.readyRed && state.readyBlue) return;

            if (player === 'red') {
                const refund = Math.min(amount, state.contributedRed);
                if (refund > 0) {
                    state.balanceRed += refund;
                    state.contributedRed -= refund;
                    state.pot -= refund;
                }
            } else {
                const refund = Math.min(amount, state.contributedBlue);
                if (refund > 0) {
                    state.balanceBlue += refund;
                    state.contributedBlue -= refund;
                    state.pot -= refund;
                }
            }
            saveState();
            updateUI();
        }

        function awardPot(player) {
            if (state.pot <= 0) return;

            if (player === 'red') {
                state.balanceRed += state.pot;
            } else {
                state.balanceBlue += state.pot;
            }

            resetRound();
        }

        function tiePot() {
            if (state.pot <= 0) return;

            const refundRed = state.contributedRed;
            const refundBlue = state.contributedBlue;

            if (refundRed + refundBlue === state.pot) {
                state.balanceRed += refundRed;
                state.balanceBlue += refundBlue;
            } else {
                const half = Math.floor(state.pot / 2);
                state.balanceRed += half;
                state.balanceBlue += (state.pot - half);
            }

            resetRound();
        }

        function resetRound() {
            state.pot = 0;
            state.contributedRed = 0;
            state.contributedBlue = 0;
            state.readyRed = false;
            state.readyBlue = false;
            saveState();
            updateUI();
        }
    </script>
</body>
</html>
