<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split Screen Bet Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Player Side Containers */
        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* Red Side (Top) - Flipped 180 degrees for face-to-face play */
        .player-1 {
            background: linear-gradient(135deg, #3a1c1c 0%, #1c1c1e 100%);
            border-bottom: 2px solid #ff3b30;
            transform: rotate(180deg);
        }

        /* Blue Side (Bottom) - Upright */
        .player-2 {
            background: linear-gradient(135deg, #1c2c3a 0%, #1c1c1e 100%);
        }

        .player-name-container {
            margin-bottom: 4px;
        }

        .player-name {
            font-size: 16px;
            font-weight: 600;
            background: none;
            border: none;
            color: #fff;
            text-align: center;
            border-bottom: 1px dashed transparent;
        }

        .player-name:focus {
            border-bottom: 1px dashed #007aff;
            outline: none;
        }

        .balance {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .action-row {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 260px;
            margin-bottom: 6px;
        }

        .btn-action {
            flex: 1;
            padding: 8px 4px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background: #2c2c2e;
            color: #fff;
        }

        .player-1 .btn-action { background: #ff3b30; }
        .player-2 .btn-action { background: #007aff; }

        .btn-action:active { opacity: 0.7; }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Ready Button */
        .btn-ready {
            width: 100%;
            max-width: 260px;
            padding: 8px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            background: #3a3a3c;
            color: #fff;
            transition: background 0.2s;
        }

        .player-1 .btn-ready.ready { background: #ff3b30; }
        .player-2 .btn-ready.ready { background: #34c759; }

        /* Central Floating Pot HUD - Left & Rotated 90 deg counter-clockwise */
        .central-hud {
            position: absolute;
            top: 65%;
            left: 85px;
            transform: translateY(-50%) rotate(-90deg);
            background: #1c1c1e;
            border: 2px solid #3a3a3c;
            border-radius: 20px;
            padding: 12px 16px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 200px;
            transform-origin: left center;
        }

        .pot-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8e8e93;
            margin-bottom: 2px;
        }

        .pot-amount {
            font-size: 22px;
            font-weight: 800;
            color: #ffcc00;
            margin-bottom: 6px;
        }

        .pot-buttons {
            display: flex;
            gap: 4px;
        }

        .pot-buttons button {
            flex: 1;
            padding: 6px 0;
            border-radius: 6px;
            border: none;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-award-1 { background: #ff3b30; color: #fff; }
        .btn-award-2 { background: #007aff; color: #fff; }
        .btn-tie { background: #8e8e93; color: #fff; width: 100%; }

        /* Timer Banner */
        .timer-banner {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 10px;
            color: #8e8e93;
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 20px;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="timer-banner" id="timerBanner">Refill: --:--:--</div>

    <!-- Player 1 Side (Top - Red & Flipped 180deg) -->
    <div class="player-side player-1">
        <div class="player-name-container">
            <input type="text" id="name1" class="player-name" value="Red Player" onchange="saveNames()">
        </div>
        <div class="balance" id="balance1">$1000</div>
        <div class="action-row">
            <button class="btn-action bet-btn-1" onclick="betToPot(1, 10)">Bet 10</button>
            <button class="btn-action bet-btn-1" onclick="betToPot(1, 50)">Bet 50</button>
            <button class="btn-action bet-btn-1" onclick="betToPot(1, 100)">Bet 100</button>
            <button class="btn-action bet-btn-1" onclick="takeBack(1)">Take Back</button>
        </div>
        <button class="btn-ready" id="readyBtn1" onclick="toggleReady(1)">Ready Up</button>
    </div>

    <!-- Central Pot HUD -->
    <div class="central-hud">
        <div class="pot-title">The Pot</div>
        <div class="pot-amount" id="potAmount">$0</div>
        <div class="pot-buttons" style="margin-bottom: 4px;">
            <button class="btn-award-1" onclick="awardPot(1)">Red Wins</button>
            <button class="btn-award-2" onclick="awardPot(2)">Blue Wins</button>
        </div>
        <div class="pot-buttons">
            <button class="btn-tie" onclick="tiePot()">Tie / Push</button>
        </div>
    </div>

    <!-- Player 2 Side (Bottom - Blue & Upright) -->
    <div class="player-side player-2">
        <div class="player-name-container">
            <input type="text" id="name2" class="player-name" value="Blue Player" onchange="saveNames()">
        </div>
        <div class="balance" id="balance2">$1000</div>
        <div class="action-row">
            <button class="btn-action bet-btn-2" onclick="betToPot(2, 10)">Bet 10</button>
            <button class="btn-action bet-btn-2" onclick="betToPot(2, 50)">Bet 50</button>
            <button class="btn-action bet-btn-2" onclick="betToPot(2, 100)">Bet 100</button>
            <button class="btn-action bet-btn-2" onclick="takeBack(2)">Take Back</button>
        </div>
        <button class="btn-ready" id="readyBtn2" onclick="toggleReady(2)">Ready Up</button>
    </div>

    <script>
        let state = {
            name1: "Red Player",
            name2: "Blue Player",
            balance1: 1000,
            balance2: 1000,
            pot: 0,
            contributed1: 0,
            contributed2: 0,
            ready1: false,
            ready2: false,
            lastRefillTime: Date.now()
        };

        const REFILL_INTERVAL = 24 * 60 * 60 * 1000; // 24 hours

        window.onload = function() {
            loadState();
            checkDailyRefill();
            updateUI();
            setInterval(updateTimerDisplay, 1000);
        };

        function saveState() {
            try {
                localStorage.setItem('split_bet_hub_v4_state', JSON.stringify(state));
            } catch(e) {
                console.error("Storage save failed", e);
            }
        }

        function loadState() {
            const saved = localStorage.getItem('split_bet_hub_v4_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Storage load failed", e); }
            }
        }

        function checkDailyRefill() {
            const now = Date.now();
            const elapsed = now - state.lastRefillTime;

            if (elapsed >= REFILL_INTERVAL || isNaN(elapsed) || state.lastRefillTime > now) {
                const cycles = Math.max(1, Math.floor(elapsed / REFILL_INTERVAL));
                state.balance1 += (1000 * cycles);
                state.balance2 += (1000 * cycles);
                state.lastRefillTime = now;
                saveState();
            }
        }

        function updateTimerDisplay() {
            const now = Date.now();
            const nextRefillTime = state.lastRefillTime + REFILL_INTERVAL;
            let timeLeft = nextRefillTime - now;

            if (timeLeft <= 0) {
                checkDailyRefill();
                timeLeft = REFILL_INTERVAL;
            }

            const hours = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((timeLeft / 1000 / 60) % 60);
            const seconds = Math.floor((timeLeft / 1000) % 60);

            document.getElementById('timerBanner').innerText = 
                `Refill: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        function updateUI() {
            document.getElementById('name1').value = state.name1;
            document.getElementById('name2').value = state.name2;
            document.getElementById('balance1').innerText = '$' + state.balance1;
            document.getElementById('balance2').innerText = '$' + state.balance2;
            document.getElementById('potAmount').innerText = '$' + state.pot;

            const btn1 = document.getElementById('readyBtn1');
            const btn2 = document.getElementById('readyBtn2');

            if (state.ready1) {
                btn1.innerText = "Ready!";
                btn1.classList.add('ready');
            } else {
                btn1.innerText = "Ready Up";
                btn1.classList.remove('ready');
            }

            if (state.ready2) {
                btn2.innerText = "Ready!";
                btn2.classList.add('ready');
            } else {
                btn2.innerText = "Ready Up";
                btn2.classList.remove('ready');
            }

            const locked = (state.ready1 && state.ready2);
            const betButtons = document.querySelectorAll('.bet-btn-1, .bet-btn-2');
            betButtons.forEach(b => b.disabled = locked);
        }

        function saveNames() {
            state.name1 = document.getElementById('name1').value;
            state.name2 = document.getElementById('name2').value;
            saveState();
        }

        function toggleReady(player) {
            if (player === 1) {
                state.ready1 = !state.ready1;
            } else {
                state.ready2 = !state.ready2;
            }
            saveState();
            updateUI();
        }

        function betToPot(player, amount) {
            if (state.ready1 && state.ready2) return;

            if (player === 1) {
                if (state.balance1 >= amount) {
                    state.balance1 -= amount;
                    state.pot += amount;
                    state.contributed1 += amount;
                }
            } else {
                if (state.balance2 >= amount) {
                    state.balance2 -= amount;
                    state.pot += amount;
                    state.contributed2 += amount;
                }
            }
            saveState();
            updateUI();
        }

        function takeBack(player) {
            if (state.ready1 && state.ready2) return;

            if (player === 1) {
                if (state.contributed1 > 0) {
                    let amount = state.contributed1;
                    state.balance1 += amount;
                    state.pot -= amount;
                    state.contributed1 = 0;
                }
            } else {
                if (state.contributed2 > 0) {
                    let amount = state.contributed2;
                    state.balance2 += amount;
                    state.pot -= amount;
                    state.contributed2 = 0;
                }
            }
            saveState();
            updateUI();
        }

        function awardPot(player) {
            if (state.pot <= 0) return;

            if (player === 1) {
                state.balance1 += state.pot;
            } else {
                state.balance2 += state.pot;
            }

            resetRound();
        }

        function tiePot() {
            if (state.pot <= 0) return;

            state.balance1 += state.contributed1;
            state.balance2 += state.contributed2;

            let remainder = state.pot - (state.contributed1 + state.contributed2);
            if (remainder > 0) {
                state.balance1 += Math.floor(remainder / 2);
                state.balance2 += Math.ceil(remainder / 2);
            }

            resetRound();
        }

        function resetRound() {
            state.pot = 0;
            state.contributed1 = 0;
            state.contributed2 = 0;
            state.ready1 = false;
            state.ready2 = false;
            saveState();
            updateUI();
        }
    </script>
</body>
</html>
