<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Split Screen Bet Hub</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Player Side Containers */
        .player-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* Red Side (Top) - Flipped 180 degrees for face-to-face play */
        .player-1 {
            background: linear-gradient(135deg, #3a1c1c 0%, #1c1c1e 100%);
            border-bottom: 2px solid #ff3b30;
            transform: rotate(180deg);
        }

        /* Blue Side (Bottom) - Upright */
        .player-2 {
            background: linear-gradient(135deg, #1c2c3a 0%, #1c1c1e 100%);
        }

        .player-name-container {
            margin-bottom: 4px;
        }

        .player-name {
            font-size: 16px;
            font-weight: 600;
            background: none;
            border: none;
            color: #fff;
            text-align: center;
            border-bottom: 1px dashed transparent;
        }

        .player-name:focus {
            border-bottom: 1px dashed #007aff;
            outline: none;
        }

        .balance {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
        }

        .action-row {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 260px;
            margin-bottom: 6px;
        }

        .btn-action {
            flex: 1;
            padding: 10px 4px;
            border-radius: 8px;
            border: none;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background: #2c2c2e;
            color: #fff;
        }

        .player-1 .btn-action { background: #ff3b30; }
        .player-2 .btn-action { background: #007aff; }

        .btn-action:active { opacity: 0.7; }
        .btn-action:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Ready Button */
        .btn-ready {
            width: 100%;
            max-width: 260px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            background: #3a3a3c;
            color: #fff;
            transition: background 0.2s;
        }

        .player-1 .btn-ready.ready { background: #ff3b30; }
        .player-2 .btn-ready.ready { background: #34c759; }

        /* Central Floating Pot HUD - Left & Rotated 90 deg counter-clockwise */
        .central-hud {
            position: absolute;
            top: 62%;
            left: 85px;
            transform: translateY(-50%) rotate(-90deg);
            background: #1c1c1e;
            border: 2px solid #3a3a3c;
            border-radius: 20px;
            padding: 12px 16px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 200px;
            transform-origin: left center;
        }

        .pot-title {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #8e8e93;
            margin-bottom: 2px;
        }

        .pot-amount {
            font-size: 22px;
            font-weight: 800;
            color: #ffcc00;
            margin-bottom: 6px;
        }

        .pot-buttons {
            display: flex;
            gap: 4px;
        }

        .pot-buttons button {
            flex: 1;
            padding: 8px 0;
            border-radius: 6px;
            border: none;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-award-1 { background: #ff3b30; color: #fff; }
        .btn-award-2 { background: #007aff; color: #fff; }
        .btn-tie { background: #8e8e93; color: #fff; width: 100%; }

        /* Floating Control Bar for Timer & Manual Backup */
        .utility-bar {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 20;
        }

        .util-btn {
            background: #2c2c2e;
            color: #fff;
            border: 1px solid #3a3a3c;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
        }
        .util-btn:active { background: #48484a; }

        .timer-banner {
            font-size: 10px;
            color: #8e8e93;
            background: rgba(255,255,255,0.07);
            padding: 6px 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="utility-bar">
        <button class="util-btn" onclick="exportBackup()">Backup</button>
        <button class="util-btn" onclick="importBackup()">Restore</button>
        <div class="timer-banner" id="timerBanner">Refill: --:--:--</div>
    </div>

    <!-- Player 1 Side (Top - Red & Flipped 180deg) -->
    <div class="player-side player-1">
        <div class="player-name-container">
            <input type="text" id="name1" class="player-name" value="Red Player" onchange="saveNames()">
        </div>
        <div class="balance" id="balance1">$1000</div>
        <div class="action-row">
            <button class="btn-action bet-btn-1" onclick="betToPot(1, 10)">Bet 10</button>
            <button class="btn-action bet-btn-1" onclick="betToPot(1, 50)">Bet 50</button>
            <button class="btn-action bet-btn-1" onclick="betToPot(1, 100)">Bet 100</button>
            <button class="btn-action bet-btn-1" onclick="takeBack(1)">Take Back</button>
        </div>
        <button class="btn-ready" id="readyBtn1" onclick="toggleReady(1)">Ready Up</button>
    </div>

    <!-- Central Pot HUD -->
    <div class="central-hud">
        <div class="pot-title">The Pot</div>
        <div class="pot-amount" id="potAmount">$0</div>
        <div class="pot-buttons" style="margin-bottom: 4px;">
            <button class="btn-award-1" onclick="awardPot(1)">Red Wins</button>
            <button class="btn-award-2" onclick="awardPot(2)">Blue Wins</button>
        </div>
        <div class="pot-buttons">
            <button class="btn-tie" onclick="tiePot()">Tie / Push</button>
        </div>
    </div>

    <!-- Player 2 Side (Bottom - Blue & Upright) -->
    <div class="player-side player-2">
        <div class="player-name-container">
            <input type="text" id="name2" class="player-name" value="Blue Player" onchange="saveNames()">
        </div>
        <div class="balance" id="balance2">$1000</div>
        <div class="action-row">
            <button class="btn-action bet-btn-2" onclick="betToPot(2, 10)">Bet 10</button>
            <button class="btn-action bet-btn-2" onclick="betToPot(2, 50)">Bet 50</button>
            <button class="btn-action bet-btn-2" onclick="betToPot(2, 100)">Bet 100</button>
            <button class="btn-action bet-btn-2" onclick="takeBack(2)">Take Back</button>
        </div>
        <button class="btn-ready" id="readyBtn2" onclick="toggleReady(2)">Ready Up</button>
    </div>

    <script>
        let state = {
            name1: "Red Player",
            name2: "Blue Player",
            balance1: 1000,
            balance2: 1000,
            pot: 0,
            contributed1: 0,
            contributed2: 0,
            ready1: false,
            ready2: false,
            lastClaimedDate: "" // Track last calendar date refill was given based on EST 8:15 AM
        };

        window.onload = function() {
            loadState();
            checkDailyRefill();
            updateUI();
            setInterval(updateTimerDisplay, 1000);
        };

        function saveState() {
            try {
                localStorage.setItem('split_bet_hub_v9_state', JSON.stringify(state));
            } catch(e) {
                console.error("Storage save failed", e);
            }
        }

        function loadState() {
            const saved = localStorage.getItem('split_bet_hub_v9_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    state = { ...state, ...parsed };
                } catch(e) { console.error("Storage load failed", e); }
            }
        }

        // Helper to get current Date object adjusted/viewed in EST (America/New_York)
        function getESTDate(date = new Date()) {
            const options = { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            const parts = new Intl.DateTimeFormat('en-US', options).formatToParts(date);
            let obj = {};
            parts.forEach(p => { if (p.type !== 'literal') obj[p.type] = parseInt(p.value, 10); });
            return obj; // returns {year, month, day, hour, minute, second} in EST
        }

        // Returns a millisecond timestamp representing a specific hour:minute on a given EST calendar day
        function getESTTimestampForTime(estObj, targetHour, targetMinute) {
            // Construct a date string matching EST time representation
            // We can calculate offset or use standard relative generation
            const d = new Date();
            // Format string to evaluate local conversion safely
            const estString = `${estObj.year}-${String(estObj.month).padStart(2,'0')}-${String(estObj.day).padStart(2,'0')}T${String(targetHour).padStart(2,'0')}:${String(targetMinute).padStart(2,'0')}:00`;
            
            // Temporary trick to find exact UTC time for EST string
            const tempDate = new Date(estString + "Z"); // parse as UTC baseline then adjust for EST (-5 or -4)
            // Better approach: use Intl to find exact offset of America/New_York right now
            const utcDate = new Date();
            const estTimeFormatted = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', timeStyle: 'long', dateStyle: 'full' }).format(utcDate);
            
            // Let's compute target milestone timestamp directly via iterative offset check or standard target
            // Standard EST is UTC-5, EDT is UTC-4. Let's let JS parser handle target date lookup accurately:
            const targetStringString = `${estObj.year}-${String(estObj.month).padStart(2,'0')}-${String(estObj.day).padStart(2,'0')}T${String(targetHour).padStart(2,'0')}:${String(targetMinute).padStart(2,'0')}:00-05:00`;
            let targetTime = new Date(targetStringString).getTime();
            
            // If daylight savings makes it EDT (-04:00), adjust automatically
            const checkEst = getESTDate(new Date(targetTime));
            if (checkEst.hour !== targetHour) {
                const targetStringStringEDT = `${estObj.year}-${String(estObj.month).padStart(2,'0')}-${String(estObj.day).padStart(2,'0')}T${String(targetHour).padStart(2,'0')}:${String(targetMinute).padStart(2,'0')}:00-04:00`;
                targetTime = new Date(targetStringStringEDT).getTime();
            }
            return targetTime;
        }

        function checkDailyRefill() {
            const estNow = getESTDate();
            
            // Find today's 8:15 AM EST timestamp
            let target815Today = getESTTimestampForTime(estNow, 8, 15);
            
            // Current timestamp in general
            const nowMs = Date.now();
            
            // Determine the active "refill cycle day key" (e.g. "2026-06-06")
            // If current EST time is BEFORE 8:15 AM, the active cycle started at 8:15 AM YESTERDAY.
            // If current EST time is AFTER 8:15 AM, the active cycle started at 8:15 AM TODAY.
            let activeCycleDateKey = "";
            let nextRefillMs = 0;

            const currentMinutesFromMidnight = estNow.hour * 60 + estNow.minute;
            const refillMinutesFromMidnight = 8 * 60 + 15; // 8:15 AM = 495 minutes

            let baseDate = new Date();
            if (currentMinutesFromMidnight < refillMinutesFromMidnight) {
                // We are before 8:15 AM today. The latest refill happened yesterday at 8:15 AM.
                let yesterday = new Date(baseDate.getTime() - 24 * 60 * 60 * 1000);
                let estYesterday = getESTDate(yesterday);
                activeCycleDateKey = `${estYesterday.year}-${estYesterday.month}-${estYesterday.day}`;
                nextRefillMs = target815Today; // Today at 8:15 AM is the next refill!
            } else {
                // We are at or after 8:15 AM today. Latest refill happened today at 8:15 AM.
                activeCycleDateKey = `${estNow.year}-${estNow.month}-${estNow.day}`;
                // Next refill is tomorrow at 8:15 AM
                let tomorrow = new Date(baseDate.getTime() + 24 * 60 * 60 * 1000);
                let estTomorrow = getESTDate(tomorrow);
                nextRefillMs = getESTTimestampForTime(estTomorrow, 8, 15);
            }

            // If user hasn't claimed for this active cycle yet, give them $1,000!
            if (state.lastClaimedDate !== activeCycleDateKey) {
                // If it's a brand new install / state has no lastClaimedDate, don't auto-grant free money on first boot unless desired, 
                // but here we check if state initialized. If state.lastClaimedDate is undefined, set it to current to prevent instant inflation on fresh boot, or grant it.
                if (state.lastClaimedDate === undefined || state.lastClaimedDate === "") {
                    state.lastClaimedDate = activeCycleDateKey;
                } else {
                    state.balance1 += 1000;
                    state.balance2 += 1000;
                    state.lastClaimedDate = activeCycleDateKey;
                }
                saveState();
            }
        }

        function updateTimerDisplay() {
            const estNow = getESTDate();
            const currentMinutesFromMidnight = estNow.hour * 60 + estNow.minute;
            const refillMinutesFromMidnight = 8 * 60 + 15;

            let baseDate = new Date();
            let targetRefillTime = 0;

            if (currentMinutesFromMidnight < refillMinutesFromMidnight) {
                targetRefillTime = getESTTimestampForTime(estNow, 8, 15);
            } else {
                let tomorrow = new Date(baseDate.getTime() + 24 * 60 * 60 * 1000);
                let estTomorrow = getESTDate(tomorrow);
                targetRefillTime = getESTTimestampForTime(estTomorrow, 8, 15);
            }

            let timeLeft = targetRefillTime - Date.now();
            if (timeLeft <= 0) {
                checkDailyRefill();
                timeLeft = 0;
            }

            const hours = Math.floor((timeLeft / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((timeLeft / 1000 / 60) % 60);
            const seconds = Math.floor((timeLeft / 1000) % 60);

            document.getElementById('timerBanner').innerText = 
                `Refill @ 8:15 AM EST: ${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        // 4-Number / PIN Backup & Restore
        function exportBackup() {
            let pin1 = Math.abs(state.balance1) % 9000 + 1000;
            let pin2 = Math.abs(state.balance2) % 9000 + 1000;
            let shortPin = String(pin1).slice(0, 2) + String(pin2).slice(0, 2);
            
            prompt(`Your Backup Code (or exact balances):\n`, `${state.balance1},${state.balance2}`);
        }

        function importBackup() {
            const input = prompt("Enter your backup balances (e.g. 1500,800):");
            if (input) {
                let nums = input.match(/-?\d+/g);
                if (nums && nums.length >= 2) {
                    state.balance1 = parseInt(nums[0], 10);
                    state.balance2 = parseInt(nums[1], 10);
                    saveState();
                    updateUI();
                    alert("Balances restored successfully!");
                } else {
                    alert("Please enter two numbers separated by a comma (e.g. 1500,800).");
                }
            }
        }

        function updateUI() {
            document.getElementById('name1').value = state.name1;
            document.getElementById('name2').value = state.name2;
            document.getElementById('balance1').innerText = '$' + state.balance1;
            document.getElementById('balance2').innerText = '$' + state.balance2;
            document.getElementById('potAmount').innerText = '$' + state.pot;

            const btn1 = document.getElementById('readyBtn1');
            const btn2 = document.getElementById('readyBtn2');

            if (state.ready1) {
                btn1.innerText = "Ready!";
                btn1.classList.add('ready');
            } else {
                btn1.innerText = "Ready Up";
                btn1.classList.remove('ready');
            }

            if (state.ready2) {
                btn2.innerText = "Ready!";
                btn2.classList.add('ready');
            } else {
                btn2.innerText = "Ready Up";
                btn2.classList.remove('ready');
            }

            const locked = (state.ready1 && state.ready2);
            const betButtons = document.querySelectorAll('.bet-btn-1, .bet-btn-2');
            betButtons.forEach(b => b.disabled = locked);
        }

        function saveNames() {
            state.name1 = document.getElementById('name1').value;
            state.name2 = document.getElementById('name2').value;
            saveState();
        }

        function toggleReady(player) {
            if (player === 1) {
                state.ready1 = !state.ready1;
            } else {
                state.ready2 = !state.ready2;
            }
            saveState();
            updateUI();
        }

        function betToPot(player, amount) {
            if (state.ready1 && state.ready2) return;

            if (player === 1) {
                if (state.balance1 >= amount) {
                    state.balance1 -= amount;
                    state.pot += amount;
                    state.contributed1 += amount;
                }
            } else {
                if (state.balance2 >= amount) {
                    state.balance2 -= amount;
                    state.pot += amount;
                    state.contributed2 += amount;
                }
            }
            saveState();
            updateUI();
        }

        function takeBack(player) {
            if (state.ready1 && state.ready2) return;

            if (player === 1) {
                if (state.contributed1 > 0) {
                    let amount = state.contributed1;
                    state.balance1 += amount;
                    state.pot -= amount;
                    state.contributed1 = 0;
                }
            } else {
                if (state.contributed2 > 0) {
                    let amount = state.contributed2;
                    state.balance2 += amount;
                    state.pot -= amount;
                    state.contributed2 = 0;
                }
            }
            saveState();
            updateUI();
        }

        function awardPot(player) {
            if (state.pot <= 0) return;

            if (player === 1) {
                state.balance1 += state.pot;
            } else {
                state.balance2 += state.pot;
            }

            resetRound();
        }

        function tiePot() {
            if (state.pot <= 0) return;

            state.balance1 += state.contributed1;
            state.balance2 += state.contributed2;

            let remainder = state.pot - (state.contributed1 + state.contributed2);
            if (remainder > 0) {
                state.balance1 += Math.floor(remainder / 2);
                state.balance2 += Math.ceil(remainder / 2);
            }

            resetRound();
        }

        function resetRound() {
            state.pot = 0;
            state.contributed1 = 0;
            state.contributed2 = 0;
            state.ready1 = false;
            state.ready2 = false;
            saveState();
            updateUI();
        }
    </script>
</body>
</html>
